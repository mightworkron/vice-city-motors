      tratamiento: "referido/partner — nunca servicio directo de TSRM; contenido verificado y complementado manualmente"
    - id: "sales"
      nombre_display: "Sales"
      estado_contenido: "bloqueada"
      motivo_bloqueo: "falta documentacion de Liza; tratamiento pendiente de ratificar. Enum ya migrado, ya no es motivo de bloqueo."
      tratamiento: "referido/partner — nunca servicio directo de TSRM; contenido verificado y complementado manualmente"

bloques_emergentes:
  bugs: []

  deuda_tecnica:
    - id: "TD-01"
      titulo: "Tipos generados de Supabase desactualizados"
      descripcion: >
        src/integrations/supabase/types.ts sigue con Enums: {} vacio —
        nunca se regenero desde que se crearon las tablas. No bloquea hoy
        (nada en el codigo depende todavia del enum), pero en cuanto F3/F4
        empiecen a tocar frontend con validaciones tipadas, hace falta
        correr la regeneracion (supabase gen types typescript) o el codigo
        va a trabajar sin tipado real sobre la columna linea.
      prioridad: "media"
      estado: "abierta"

    - id: "TD-02"
      titulo: "Documentacion legado con nomenclatura incorrecta fuera de docs/proyectos/blog/"
      descripcion: >
        docs/legacy/handoff-root-2026-07-30.md:90 sigue con referencias a
        collision_repair_insurance. No bloquea nada, pero puede confundir
        a otra sesion futura que lea ese archivo sin saber que quedo
        obsoleto.
      prioridad: "baja"
      estado: "abierta"

    - id: "TD-03"
      titulo: "Acceso MCP a Supabase con escritura persistente sin scoping por operacion"
      descripcion: >
        Ya resuelto el problema mas grave (legacy token -> tokens scopeados
        por proyecto y por permiso, ver DT-002 en gobernanza-tsm), pero el
        acceso sigue siendo de escritura persistente para cualquier sesion
        futura, sin barrera tecnica de aprobacion, solo por disciplina de
        seguir el flujo del instructivo. Evaluar en el futuro modo
        --read-only por defecto con escritura bajo demanda puntual.
      prioridad: "baja"
      estado: "abierta"

    - id: "TD-04"
      titulo: "Ausencia de artefacto tecnico de la migracion del enum en el repo"
      descripcion: >
        La migracion del enum post_linea_negocio de 6 a 7 valores en staging
        y produccion (fases 1 y 2, 10 sep 2026) no dejo artefacto tecnico en
        el repo — no hay carpeta supabase/migrations con el SQL versionado,
        no hay log de salida del CLI commiteado, y
        src/integrations/supabase/types.ts sigue con Enums vacio (relacionado
        con TD-01). Toda la evidencia del estado real del enum es narrativa
        de handoff.md, workplan.yml y decisiones.md, no verificable
        independientemente desde el repo.
      prioridad: "media"
      estado: "cerrada"
      fecha_verificacion: "2026-09-11"
      evidencia: "https://github.com/mightworkron/vice-city-motors/commit/1bc415f9d7db373c59347fef118ca78d79c9d5ea"
      accion_requerida: >
        Verificacion independiente contra Supabase (staging y produccion)
        que confirme los 7 valores del enum y quede registrada en
        handoff.md con fecha y query ejecutada. Requerida antes de F5
        (arranque de produccion de contenido). Complementaria a TD-01
        (regeneracion de tipos) — TD-04 verifica el estado real de la base;
        TD-01 sincroniza el codigo con ese estado.

  preguntas_rfc: []
